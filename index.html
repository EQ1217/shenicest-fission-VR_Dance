<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VR 舞蹈 demo · 声动舞台</title>
    <style>
      body {
        margin: 0;
        background: #0a0a14;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #wrap { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
      #camBox { position: relative; width: 640px; height: 480px; }
      video, #overlay { position: absolute; left: 0; top: 0; width: 640px; height: 480px; }
      #renderBox { width: 640px; height: 480px; border: 1px solid #222; background: #000; }
      #ui { width: 300px; display: flex; flex-direction: column; gap: 10px; }
      #ui h3 { margin: 0; }
      button, input[type="file"] {
        padding: 9px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1c1c2e;
        color: #fff;
        cursor: pointer;
      }
      #status { font-size: 12px; color: #9a9ab0; line-height: 1.7; }
      kbd { background: #333; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div style="padding:12px 16px;background:#12121f;border-bottom:1px solid #333;font-size:14px;color:#9fb0ff;">
      正式演示请用：电脑打开 <a href="/pose.html" style="color:#8fd0ff;">pose.html</a>，Pico 打开 <a href="/mr.html" style="color:#8fd0ff;">mr.html</a>。本页是旧的本地预览。
    </div>
    <div id="wrap">
      <div id="camBox">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay" width="640" height="480"></canvas>
      </div>
      <div id="renderBox"></div>
      <div id="ui">
        <h3>VR 舞蹈 demo</h3>
        <label>① 选一首音乐（可选，没有也能玩）</label>
        <input id="musicFile" type="file" accept="audio/*" />
        <button id="btnMusic">② 播放音乐 + 节拍检测</button>
        <button id="btnMetro">③ 自动节拍模式（无音乐时用）</button>
        <button id="btnScene">④ 手动切景</button>
        <div id="status">状态：加载模型中…</div>
        <div style="font-size: 12px; color: #666; line-height: 1.8">
          快捷键：<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切景 ｜ 快速挥手触发粒子爆发
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
